{% extends 'base.html' %}{% block title %}Reset password | StudySpace{% endblock %}{% block content %}<main class="auth-page"><section class="auth-card"><p class="eyebrow">VERIFY OTP</p><h1>Set a new password</h1><p class="auth-intro">Enter the 4-digit code sent to {{ email }}. It expires in 10 minutes.</p><form method="post"><input type="hidden" name="email" value="{{ email }}"><label>OTP<input name="otp" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></label><label>New password<input type="password" name="password" minlength="8" required></label><button class="button" type="submit">Reset password</button></form><p class="auth-switch"><a href="{{ url_for('forgot_password') }}">Send a new OTP</a></p></section></main>{% endblock %}
